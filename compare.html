<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironworks Gym · Old vs New</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/tools.css">
</head>
<body class="canvas" data-phones="2" data-reserve="200">
  <main class="compare">
    <p class="compare-title">sees your work first</p>
    <div class="compare-row">
      <div class="compare-item is-old">
        <div class="phone-fit"><div class="phone"><iframe src="before.html" title="Old: site covered by pop-up" tabindex="-1"></iframe></div></div>
        <span class="compare-label">Old</span>
      </div>
      <div class="compare-item is-new">
        <div class="phone-fit"><div class="phone"><iframe src="after.html" title="New: site with no pop-up"></iframe></div></div>
        <span class="compare-label">New</span>
      </div>
    </div>
  </main>
  <script src="js/phone.js"></script>
</body>
</html>
